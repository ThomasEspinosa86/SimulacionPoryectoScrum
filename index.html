<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias Patunas</title>
</head>
<body>
    <h1>Historias Patunas</h1>
    <p>Bienvenido a las historias patunas!</p>
    

    <div id="historias-container">
        <h2>Lista de Historias</h2>
        <ul id="historias-list">
            <!-- Las historias se agregarán aquí dinámicamente -->
        </ul>
    </div>  
    <div class="form-container">
        <h2>Agregar Nueva Historia</h2>
        <form id="historia-form">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" required>
            <br>
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" required></textarea>
            <br>
            <button type="submit">Agregar Historia</button>
        </form>
    <div>
    
    <div id="mensaje"></div>

    <script src="script.js"></script>
    ´<picture> url</picture>
    
</body>
</html>
